name: Release builds

# Builds the packaged downloads and attaches them to a release (SLIP-0018).
#
# A published release starts it. Running it by hand builds the same files
# and keeps them on the run instead, so a build can be tried before there is
# a release to attach it to.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux AppImage
    # The oldest Ubuntu GitHub offers: a build starts on systems as old as
    # the one it was made on, and no older.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write  # attach the files to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Qt runtime libraries
        # The first four are what importing QtWidgets needs (see ci.yml). The
        # xcb ones are what Qt's X11 plugin links against: the bundler copies
        # a library into the build only if it finds it here, and a build made
        # without them opens no window on an X11 desktop that lacks them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xkb1

      - name: Build and self-check
        run: ./scripts/build-appimage.sh

      # Only this step sees the signing key (SLIP-0030). An empty secret
      # fails it, so nothing unsigned is uploaded.
      - name: Sign the download
        env:
          SLIPCASE_SIGNING_KEY: ${{ secrets.SLIPCASE_SIGNING_KEY }}
        run: build/venv/bin/python scripts/sign-release.py dist/Slipcase-x86_64.AppImage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Slipcase-x86_64.AppImage
          path: |
            dist/Slipcase-x86_64.AppImage
            dist/Slipcase-x86_64.AppImage.sha256
            dist/Slipcase-x86_64.AppImage.sig
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            dist/Slipcase-x86_64.AppImage dist/Slipcase-x86_64.AppImage.sha256 \
            dist/Slipcase-x86_64.AppImage.sig

  windows:
    name: Windows portable exe
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write  # attach the files to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Build and self-check
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Sign the download
        shell: pwsh
        env:
          SLIPCASE_SIGNING_KEY: ${{ secrets.SLIPCASE_SIGNING_KEY }}
        run: |
          & build\venv\Scripts\python.exe scripts\sign-release.py dist\Slipcase-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Slipcase-windows-x64.exe
          path: |
            dist/Slipcase-windows-x64.exe
            dist/Slipcase-windows-x64.exe.sha256
            dist/Slipcase-windows-x64.exe.sig
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            dist/Slipcase-windows-x64.exe dist/Slipcase-windows-x64.exe.sha256 \
            dist/Slipcase-windows-x64.exe.sig

  macos:
    # One build per processor type: a build is for the processor of the
    # machine that made it.
    name: macOS disk image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    permissions:
      contents: write  # attach the files to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Build and self-check
        run: ./scripts/build-macos.sh

      - name: Sign the download
        env:
          SLIPCASE_SIGNING_KEY: ${{ secrets.SLIPCASE_SIGNING_KEY }}
          ARCH: ${{ matrix.arch }}
        run: build/venv/bin/python scripts/sign-release.py "dist/Slipcase-macos-$ARCH.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Slipcase-macos-${{ matrix.arch }}.dmg
          path: |
            dist/Slipcase-macos-${{ matrix.arch }}.dmg
            dist/Slipcase-macos-${{ matrix.arch }}.dmg.sha256
            dist/Slipcase-macos-${{ matrix.arch }}.dmg.sig
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            "dist/Slipcase-macos-$ARCH.dmg" "dist/Slipcase-macos-$ARCH.dmg.sha256" \
            "dist/Slipcase-macos-$ARCH.dmg.sig"
