name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install Qt runtime libraries
        # PyQt6 bundles Qt but links against the system EGL/GL and input
        # stacks, which a bare runner does not carry. Without these, importing
        # QtWidgets fails at test collection and no test runs at all. The
        # tests use Qt's offscreen platform, so the xcb libraries are not
        # needed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.txt

      - name: Run the gate
        run: ./scripts/local-ci.sh
