name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes. Not on the
# default branch: there a cancelled run would hide which commit broke it. The
# event is in the key so a push and a pull request never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  gate:
    name: Lint and test
    runs-on: ubuntu-latest
    # A cold run takes about a minute; a hung one would otherwise hold a
    # runner for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Qt runtime libraries
        # PyQt6 bundles Qt but links against the system EGL/GL and input
        # stacks, which a bare runner does not carry. Without these, importing
        # QtWidgets fails at test collection and no test runs at all. The
        # tests use Qt's offscreen platform, so the xcb libraries are not
        # needed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.txt

      - name: Run the gate
        run: ./scripts/local-ci.sh

  other-systems:
    # The packaged Windows and macOS builds are made from this code, and the
    # gate above only ever runs on Linux. No local run covers this job: a
    # Linux machine cannot run either system. The lint is not repeated here;
    # it does not depend on the operating system.
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.lock -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest tests/ -q
