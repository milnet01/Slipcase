# Exact runtime dependencies, including transitive ones.
#
# requirements.txt states what Slipcase depends on and the minimum it needs.
# This file states what a build actually installs, so two builds of one
# release bundle the same libraries and a rendering change arriving from a
# dependency is traceable to a commit here.
#
# CI and the packaged builds install from this file. Developing against
# requirements.txt is fine and is how a newer release gets noticed.
#
# Regenerate on the Python version CI uses (see .github/workflows/ci.yml):
#
#   python3.12 -m venv /tmp/lock && /tmp/lock/bin/pip install -r requirements.txt
#   /tmp/lock/bin/pip freeze > requirements.lock   # then restore this header
#
# and the Intel Mac cryptography line below. cryptography ships no Intel Mac
# wheel from 49 on, so pip compiles it there against the machine's own
# OpenSSL and the bundle loads the wrong one (the self-check failed on
# macos-15-intel, 2026-10-29). 48.0.1 is the last with that wheel. The Intel
# Mac build never checks a signature (SLIP-0031, notify-only), so the
# advisories fixed in 49 and 50 (X.509 and PKCS#7 only) do not reach it.
#
